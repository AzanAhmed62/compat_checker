project_id = "compat-checker"

# Compat Checker uses an independent local stack. These ports deliberately do
# not overlap the default Supabase ports (54321-54329) used by other projects
# on the same workstation, including GB Rides.
[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

# Studio is disabled by default to keep the local stack within the memory
# budget of the development machine. Enable it only when needed.
[studio]
enabled = false
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.admin-csv]
verify_jwt = true

[functions.purge-pending-accounts]
# The worker authenticates with PURGE_CRON_SECRET; it does not accept user JWTs.
verify_jwt = false
