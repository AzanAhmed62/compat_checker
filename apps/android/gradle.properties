# The development machine has 8 GB of RAM. Keep the build within a predictable
# memory budget; increase these values only when enough physical RAM is available.
# The 768 MB metaspace is required by the Room migration test's room-testing
# dependency; 384 MB fails during Gradle project configuration.
org.gradle.jvmargs=-Xmx1536m -Xms256m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=1
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.useAndroidX=true
