name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: SQL and RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: compat_ci
      KEEP_DB: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Apply shim, migrations, seed, and SQL tests
        run: bash scripts/db_test.sh

  admin:
    name: Admin typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin_panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: |
          printf 'platforms;android-36\nbuild-tools;36.0.0\n' > "$RUNNER_TEMP/android-packages.txt"
          sdkmanager --package_file="$RUNNER_TEMP/android-packages.txt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug and run unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
